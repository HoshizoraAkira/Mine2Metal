org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric, see https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19-SNAPSHOT
fabric_api_version=0.165.0+26.3

# Sodium is on the dev runtime so every run exercises the compat path
sodium_version=mc26.3-0.9.3-beta.1-fabric

# Mod
version=0.0.1
group=dev.mine2metal

# Native library
macos_min_version=14.0
# Where the Modrinth App and Prism Launcher download that Sodium for the .mrpack (the same file as sodium_version;
# its hashes are computed from the resolved artifact)
sodium_mrpack_url=https://cdn.modrinth.com/data/AANobbMI/versions/g6ju16VJ/sodium-fabric-0.9.3-beta.1%2Bmc26.3.jar
