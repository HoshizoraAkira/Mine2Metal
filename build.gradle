plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

loom {
	runs {
		client {
			// FFM downcalls are "restricted" methods; without this Java 25 prints a warning per module
			vmArg '--enable-native-access=ALL-UNNAMED'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	compileOnly "maven.modrinth:sodium:${project.sodium_version}"
	// -PnoSodium runs the game on the vanilla chunk renderer, to tell backend bugs apart from Sodium ones.
	if (!project.hasProperty('noSodium')) {
		localRuntime "maven.modrinth:sodium:${project.sodium_version}"
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'mine2metal-gametest'
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// FSR frame generation shaders: AMD's GLSL translated to MSL (glslangValidator and spirv-cross, both in Homebrew) and
// embedded in the dylib as C.
tasks.register('buildFsrShaders', Exec) {
	def outputDirectory = layout.buildDirectory.dir('fsr-shaders')
	def isMac = System.getProperty('os.name').startsWith('Mac')

	inputs.dir('third_party/fidelityfx-1.1.4')
	inputs.dir('src/main/native/fsr/glsl')
	inputs.files('scripts/build-fsr-shaders.sh', 'scripts/build-fsr-embedded.sh')
	outputs.file(outputDirectory.map { it.file('fsr_shaders.c') })

	onlyIf { isMac }

	commandLine 'sh', 'scripts/build-fsr-embedded.sh', outputDirectory.get().asFile.absolutePath
}

// The native side is a single dylib built with the system clang and shipped inside the jar: the Objective-C backend,
// the FidelityFX backend and AMD's FidelityFX host code (see scripts/build-native.sh).
tasks.register('buildNative', Exec) {
	def sources = fileTree('src/main/native') { include '**/*.m', '**/*.mm', '**/*.h' }
	def output = layout.buildDirectory.file('native/libmine2metal.dylib')
	def shaders = layout.buildDirectory.file('fsr-shaders/fsr_shaders.c')
	def minVersion = project.macos_min_version
	def isMac = System.getProperty('os.name').startsWith('Mac')

	dependsOn 'buildFsrShaders'
	inputs.files(sources)
	inputs.dir('third_party/fidelityfx-1.1.4')
	inputs.files('scripts/build-native.sh')
	inputs.file(shaders)
	inputs.property 'macosMinVersion', minVersion
	outputs.file(output)

	onlyIf { isMac }

	doFirst { output.get().asFile.parentFile.mkdirs() }

	commandLine 'sh', 'scripts/build-native.sh', output.get().asFile.absolutePath, minVersion, shaders.get().asFile.absolutePath
}

processResources {
	def version = project.version
	inputs.property 'version', version

	filesMatching('fabric.mod.json') {
		expand 'version': version
	}

	from(tasks.named('buildNative')) {
		into 'natives/macos-arm64'
	}
	from('LICENSE') {
		into 'META-INF/licenses'
		rename { 'mine2metal-LICENSE.txt' }
	}
	// The dylib contains AMD FidelityFX SDK code, whose MIT license must ship with it.
	from('third_party/fidelityfx-1.1.4/LICENSE.txt') {
		into 'META-INF/licenses'
		rename { 'AMD-FidelityFX-SDK-LICENSE.txt' }
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// A one-click install for the Modrinth App and Prism Launcher: Minecraft, Fabric Loader and Sodium come from their
// usual sources, and this mod rides along in overrides/mods until it is on Modrinth itself.
def mrpackSodium = configurations.detachedConfiguration(dependencies.create("maven.modrinth:sodium:${project.sodium_version}"))
mrpackSodium.transitive = false

def writeMrpackIndex = tasks.register('writeMrpackIndex') {
	def index = layout.buildDirectory.file('mrpack/modrinth.index.json')
	def version = project.version
	def minecraftVersion = project.minecraft_version
	def loaderVersion = project.loader_version
	def sodiumUrl = project.sodium_mrpack_url
	inputs.files(mrpackSodium)
	inputs.property 'version', version
	inputs.property 'minecraftVersion', minecraftVersion
	inputs.property 'loaderVersion', loaderVersion
	inputs.property 'sodiumUrl', sodiumUrl
	outputs.file(index)

	doLast {
		File sodium = mrpackSodium.singleFile
		def digest = { String algorithm -> java.security.MessageDigest.getInstance(algorithm).digest(sodium.bytes).encodeHex().toString() }
		String fileName = java.net.URLDecoder.decode(sodiumUrl.substring(sodiumUrl.lastIndexOf('/') + 1), 'UTF-8')
		def json = [
			formatVersion: 1,
			game: 'minecraft',
			versionId: version,
			name: "mine2metal ${version}",
			summary: 'Minecraft rendered with Apple Metal, with Sodium. Macs with Apple silicon, macOS 14 or later.',
			files: [[
				path: "mods/${fileName}",
				hashes: [sha1: digest('SHA-1'), sha512: digest('SHA-512')],
				env: [client: 'required', server: 'unsupported'],
				downloads: [sodiumUrl],
				fileSize: sodium.length(),
			]],
			dependencies: [minecraft: minecraftVersion, 'fabric-loader': loaderVersion],
		]
		index.get().asFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)) + '\n'
	}
}

tasks.register('mrpack', Zip) {
	group = 'distribution'
	description = 'Builds a Modrinth modpack (.mrpack) with this mod, Fabric Loader and Sodium.'
	archiveExtension = 'mrpack'
	destinationDirectory = layout.buildDirectory.dir('distributions')
	from(writeMrpackIndex)
	from(tasks.named('jar')) {
		into 'overrides/mods'
	}
}

// The release jar and the .mrpack's Sodium in a production client (no dev classpath), to check the install works.
tasks.register('runProductionClient', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	group = 'distribution'
	mods.from(tasks.named('jar'))
	mods.from(mrpackSodium)
	runDir = layout.buildDirectory.dir('production-run')
	jvmArgs.add('--enable-native-access=ALL-UNNAMED')
}
